<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TO-DO LISTER — Terminal Edition</title>
<!-- PWA: manifest & iOS meta -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#001a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="TO-DO">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --bg:#000a08;
    --fg:#b3ffcc;            /* terminal green (warmer) */
    --dim:#80cc99;           /* dimmer green for separators */
    --grid:#073227;
    --accent:#b3ffcc;
  }
  *{ box-sizing:border-box }
  html,body{ height:100% }
  body{ margin:0; background:var(--bg); color:var(--fg); font-family:Menlo, Monaco, Consolas, "Courier New", monospace; letter-spacing:.2px; }
  a{ color:var(--fg); text-decoration:none; border-bottom:1px dotted var(--fg); }
  a:hover{ opacity:.9 }
  .wrap{ max-width:1100px; margin:28px auto; padding:0 20px; }

  header{ display:flex; justify-content:space-between; align-items:center; padding:10px 12px; margin-bottom:12px; border:1px solid var(--grid); background:var(--bg); }
  .title{ margin:0; font-size:22px; text-transform:uppercase; color:var(--accent); letter-spacing:2px; }
  .date-input, input[type="date"], button{ appearance:none; outline:none; background:#001a14; color:var(--fg); border:1px solid var(--grid); border-radius:8px; padding:6px 10px; font-family:inherit; font-size:14px; }
  input[type="date"]::-webkit-calendar-picker-indicator{ filter:invert(90%) hue-rotate(60deg) saturate(150%); opacity:.9 }
  input[type="checkbox"]{ width:16px; height:16px; accent-color: var(--accent); }

  .tasks-area{ margin:8px 0 20px; border:1px solid var(--grid); background:#001410; padding:12px; }
  .category{ border-top:1px solid var(--grid); padding-top:12px; margin-top:12px; }
  .category:first-child{ border-top:none; padding-top:0; margin-top:0; }
  .category h3{ font-size:14px; margin:0 0 8px 0; font-weight:700; text-transform:uppercase; display:flex; gap:10px; align-items:center; flex-wrap:wrap; color:var(--fg); }
  .cat-links{ display:inline-flex; align-items:center; gap:0; }
  .cat-links .sep{ color:var(--dim); margin:0 8px; }

  .task{ display:grid; grid-template-columns:22px 1fr auto; gap:10px; align-items:start; padding:6px 0; border-bottom:1px dashed rgba(179,255,204,.25); }
  .task:last-child{ border-bottom:none; }
  .task.done .txt{ text-decoration:line-through; opacity:.7; }

  .editable{ cursor:text; padding:2px 4px; border-radius:4px; }
  .editable:focus{ outline:1px dashed var(--accent); outline-offset:2px; background:rgba(179,255,204,.08); }

  .subtasks{ margin:6px 0 0 0; padding-left:32px; display:flex; flex-direction:column; gap:6px; }
  .subtask{ display:grid; grid-template-columns:20px 1fr auto; gap:8px; align-items:center; }

  .composer{ outline:none; border:0; padding:6px 8px; border-radius:6px; background:#001a14; min-height:24px; color:var(--fg); }
  .composer:hover{ background:#002a20; }
  .composer:focus{ background:#003a2a; box-shadow:0 0 0 1px var(--accent) inset; }

  .card{ border:1px solid var(--grid); border-radius:10px; padding:14px; background:#001410; }
  .heading{ font-size:14px; font-weight:700; text-transform:uppercase; color:var(--fg); margin:0 0 8px 0; display:flex; align-items:center; gap:10px; }
  .nc-grid{ display:grid; grid-template-columns: 1fr 200px; gap:16px; align-items:start; }
  .controls{ margin-top:12px; display:flex; gap:12px; }
  .btn-solid{ background:var(--fg); color:#000; border:1px solid var(--grid); border-radius:8px; padding:8px 12px; font-family:inherit; font-size:14px; cursor:pointer; }
  .btn-solid:hover{ filter:brightness(0.92); }

  .btn-link{ background:none; border:none; color:var(--fg); cursor:pointer; padding:0 2px; }
  .btn-link:hover{ text-decoration:underline; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 class="title">TO-DO — <input id="activeDay" type="date" class="date-input" /></h1>
    </header>

    <main id="tasksArea" class="tasks-area" aria-live="polite">
      <div id="listRoot"></div>
    </main>

    <section class="card" aria-label="New Category">
      <div class="nc-grid">
        <div>
          <h3 class="heading">New Category</h3>
          <div id="newCategoryComposer" class="composer" aria-label="New category name" contenteditable="true" role="textbox" tabindex="0"></div>
        </div>
        <div>
          <h3 class="heading">Date</h3>
          <input id="newCategoryDate" type="date" />
        </div>
      </div>
      <div class="controls">
        <button id="btnClearDay" class="btn-solid">Clear day tasks</button>
        <button id="btnRollover" class="btn-solid">Reschedule unchecked day-tasks</button>
      </div>
    </section>
  </div>


<!-- Firebase (for free cross-device sync). Fill firebaseConfig below to enable. -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script>
(function(){
  "use strict";
  // ===== constants & state =====
  const PERMANENT = ["Law School","Law360","Military","Personal","Family"];
  const QS = new URLSearchParams(location.search);
  const TEST = QS.get('test') === '1';

  // ===== Shared secret link (sync key) =====
  // Open the app with ?list=YOUR_SECRET_ID to sync the same list across devices.
  // If missing, we generate one once, store it locally, and update the URL (without reload).
  const LIST_KEY = "tdl_list_id_v1";
  function genListId(){
    const bytes = new Uint8Array(16);
    crypto.getRandomValues(bytes);
    return Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  let LIST_ID = (QS.get('list')||'').trim();
  if(!LIST_ID){
    LIST_ID = localStorage.getItem(LIST_KEY) || genListId();
    localStorage.setItem(LIST_KEY, LIST_ID);
    try{
      const url = new URL(location.href);
      url.searchParams.set('list', LIST_ID);
      history.replaceState(null, "", url.toString());
    }catch(_){}
  }else{
    localStorage.setItem(LIST_KEY, LIST_ID);
  }

  const STORAGE_KEY = ((TEST ? "tdl_state_terminal_test" : "tdl_state_terminal_v6") + "_" + LIST_ID);

  // ===== optional remote sync (Firebase) — shared by secret link (?list=...) =====
  // 1) Create a Firebase project
  // 2) Enable Authentication -> Anonymous
  // 3) Create Firestore
  // 4) Paste your firebaseConfig below (leave as-is to keep local-only)
  const firebaseConfig = {
  apiKey: "AIzaSyAB1ReCckDS3mBTLOfvNAScLwR084ev9T0",
  authDomain: "tdl-terminal.firebaseapp.com",
  projectId: "tdl-terminal",
  storageBucket: "tdl-terminal.firebasestorage.app",
  messagingSenderId: "769743566526",
  appId: "1:769743566526:web:5e31b36c289e4ba80290ef"
};

  const REMOTE_COLLECTION = "lists";   // /lists/{LIST_ID}/state/main
  const REMOTE_DOC = "main";
  let remote = { enabled:false, ready:false, uid:null, db:null, lastRemoteUpdatedAt:0 };
  let queueRemoteSave = function(_state){ /* no-op until remote init */ };

  const els = {
    activeDay: document.getElementById('activeDay'),
    listRoot: document.getElementById('listRoot'),
    newCategoryComposer: document.getElementById('newCategoryComposer'),
    newCategoryDate: document.getElementById('newCategoryDate'),
    btnClearDay: document.getElementById('btnClearDay'),
    btnRollover: document.getElementById('btnRollover'),
  };

  // ===== utils =====
  function todayStr(d=new Date()){ return d.toISOString().slice(0,10); }
  function nextDateStr(dstr){ const dt=new Date(dstr); dt.setDate(dt.getDate()+1); return dt.toISOString().slice(0,10); }

  function nowMs(){ return Date.now(); }

  function hasFirebaseConfig(cfg){
    if(!cfg) return false;
    // Minimal check: if you filled at least projectId + apiKey (or appId)
    const keys = Object.keys(cfg).filter(k => cfg[k] && typeof cfg[k]==='string');
    return keys.length >= 2;
  }

  function getOrCreateClientId(){
    const k = STORAGE_KEY + "_client_id";
    let v = localStorage.getItem(k);
    if(!v){
      v = "c_" + (Date.now() + Math.random()).toString(36);
      localStorage.setItem(k, v);
    }
    return v;
  }

  function normalizeUpdatedAt(u){
    // Firestore Timestamp -> ms, number -> ms, missing -> 0
    if(!u) return 0;
    if(typeof u === 'number') return u;
    if(u && typeof u.toMillis === 'function') return u.toMillis();
    return 0;
  }

  function mergeLocalAndRemote(localState, remoteState){
    // Last-write-wins based on updatedAtMs; tie-breaker: remote wins.
    const l = localState || {adHocByDate:{}, tasks:[]};
    const r = remoteState || {adHocByDate:{}, tasks:[]};
    const lu = normalizeUpdatedAt(l.updatedAtMs || l.updatedAt);
    const ru = normalizeUpdatedAt(r.updatedAtMs || r.updatedAt);
    if(ru >= lu) return r;
    return l;
  }

  function initRemoteSync(activeDate){
    if(typeof firebase === 'undefined') return; // SDK not loaded
    if(!hasFirebaseConfig(firebaseConfig)) return; // not configured
    try{
      firebase.initializeApp(firebaseConfig);
      remote.db = firebase.firestore();
      remote.enabled = true;
    }catch(err){
      console.warn("Firebase init failed:", err);
      return;
    }

    // Auth (anonymous)
    firebase.auth().onAuthStateChanged(async (user) => {
      if(!user){
        try{ await firebase.auth().signInAnonymously(); }catch(err){ console.warn("Anon auth failed:", err); }
        return;
      }
      remote.uid = user.uid;
      remote.ready = true;

      const docRef = remote.db.collection(REMOTE_COLLECTION).doc(LIST_ID).collection("state").doc(REMOTE_DOC);

      // Debounced remote save
      let tHandle = null;
      let pending = null;
      const clientId = getOrCreateClientId();

      queueRemoteSave = function(state){
        if(!remote.ready) return;
        pending = state;
        if(tHandle) clearTimeout(tHandle);
        tHandle = setTimeout(async ()=>{
          try{
            // Add metadata for conflict resolution + loop prevention
            const payload = Object.assign({}, pending, {
              updatedAtMs: nowMs(),
              lastWriter: clientId
            });
            await docRef.set(payload, {merge:false});
          }catch(err){
            console.warn("Remote save failed:", err);
          }
        }, 400);
      };

      // Initial pull + merge
      try{
        const snap = await docRef.get();
        if(snap.exists){
          const remoteState = snap.data();
          const localState = load();
          const merged = mergeLocalAndRemote(localState, remoteState);
          save(merged);
          render(merged, activeDate);
          remote.lastRemoteUpdatedAt = normalizeUpdatedAt(remoteState.updatedAtMs || remoteState.updatedAt);
        }else{
          // No remote yet: push local up
          queueRemoteSave(load());
        }
      }catch(err){
        console.warn("Remote initial load failed:", err);
      }

      // Live updates from other device
      docRef.onSnapshot((snap)=>{
        if(!snap.exists) return;
        const incoming = snap.data() || {};
        const incomingUpdated = normalizeUpdatedAt(incoming.updatedAtMs || incoming.updatedAt);
        if(incomingUpdated <= (remote.lastRemoteUpdatedAt || 0)) return;

        // If we were the last writer, ignore to avoid ping-pong
        const clientId2 = getOrCreateClientId();
        if(incoming.lastWriter && incoming.lastWriter === clientId2){
          remote.lastRemoteUpdatedAt = incomingUpdated;
          return;
        }

        remote.lastRemoteUpdatedAt = incomingUpdated;
        const merged = mergeLocalAndRemote(load(), incoming);
        save(merged);
        render(merged, activeDate);
      });
    });
  }
  function load(){ const raw=localStorage.getItem(STORAGE_KEY); if(raw){ try{ return JSON.parse(raw); }catch(_){} } const init={adHocByDate:{},tasks:[]}; localStorage.setItem(STORAGE_KEY, JSON.stringify(init)); return init; }
  function save(s){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
    // If remote sync is enabled, push state (debounced).
    try{ queueRemoteSave(s); }catch(_){}
  }
  function categoriesForDate(state,dateStr){
    const adhoc = state.adHocByDate[dateStr] || [];
    const base = [...PERMANENT, ...adhoc];

    // Ensure categories needed for overdue (undone) tasks also appear in the active day's view.
    const seen = new Set(base.map(c => (c||'').trim().toLowerCase()));
    state.tasks.forEach(t => {
      const isInView = (t.dueDate === dateStr) || ((t.dueDate < dateStr) && !t.done);
      if(!isInView) return;
      const cat = (t.category || '').trim();
      if(!cat) return;
      const key = cat.toLowerCase();
      if(!seen.has(key)){
        base.push(cat);
        seen.add(key);
      }
    });

    return base;
  }
  function tasksForDate(state,dateStr){
    // Show tasks scheduled for the active day, PLUS any earlier (overdue) tasks that are not done.
    // IMPORTANT: We do NOT change dueDate for overdue tasks (preserves history).
    return state.tasks.filter(t => (t.dueDate === dateStr) || ((t.dueDate < dateStr) && !t.done));
  }

  // ===== inline edit =====
  function enableInlineEdit(el,getVal,setVal,onFinish){
    const original=getVal();
    el.setAttribute('contenteditable','true');
    const r=document.createRange(); r.selectNodeContents(el); r.collapse(false);
    const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);

    const commit=()=>{
      const next=(el.textContent||'').trim();
      if(next!==original){ setVal(next||original); }
      el.removeAttribute('contenteditable');
      if(onFinish) onFinish();
    };
    const cancel=()=>{
      el.textContent=original;
      el.removeAttribute('contenteditable');
      if(onFinish) onFinish();
    };

    el.addEventListener('keydown', (e)=>{
      if(e.key==='Enter' && !e.shiftKey){
        e.preventDefault();
        commit();
      } else if(e.key==='Escape'){
        e.preventDefault();
        cancel();
      }
    });
    el.addEventListener('blur', commit, {once:true});
  }

  // ===== links & separators =====
  function addSep(container){ const s=document.createElement('span'); s.className='sep'; s.textContent='|'; container.appendChild(s); }
  function appendLink(container, href, label, lead=false){
    if(lead) addSep(container); else if(container.childNodes.length>0) addSep(container);
    const a=document.createElement('a'); a.href=href; a.textContent=label; a.target='_blank'; a.rel='noopener'; container.appendChild(a);
  }

  // ===== category helpers =====
  function deleteAdHocCategory(activeDate, name){
    const s=load(); const target=(name||'').trim().toLowerCase();
    s.tasks=s.tasks.filter(t=>!(t.dueDate===activeDate && (t.category||'').trim().toLowerCase()===target));
    if(s.adHocByDate[activeDate]) s.adHocByDate[activeDate]=s.adHocByDate[activeDate].filter(c=>(c||'').trim().toLowerCase()!==target);
    save(s); render(s,activeDate);
  }
  function renameAdHocCategory(activeDate, oldName, newName){
    const target=(newName||'').trim(); if(!target||target===oldName) return;
    if(PERMANENT.includes(target)) { alert('Cannot rename to a permanent category.'); return; }
    const s=load(); s.adHocByDate[activeDate]=s.adHocByDate[activeDate]||[]; const list=s.adHocByDate[activeDate];
    const exists=list.map(x=>x.trim().toLowerCase()).includes(target.toLowerCase());
    s.tasks.forEach(t=>{ if(t.dueDate===activeDate && (t.category||'').trim().toLowerCase()===oldName.trim().toLowerCase()){ t.category=target; }});
    if(!exists){ const idx=list.findIndex(x=>x.trim().toLowerCase()===oldName.trim().toLowerCase()); if(idx>-1) list[idx]=target; else list.push(target); }
    else { s.adHocByDate[activeDate]=list.filter(c=>c.trim().toLowerCase()!==oldName.trim().toLowerCase()); }
    save(s); render(s,activeDate);
  }

  // ===== task rendering =====
  function autoMarkParent(task){ const subs=task.subtasks||[]; if(subs.length===0) return; task.done=subs.every(s=>!!s.done); }

  function renderSubtask(activeDate,task,st){
    const row=document.createElement('div'); row.className='subtask'+(st.done?' done':'');
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=st.done;
    cb.addEventListener('change',()=>{
      const s=load(); const i=s.tasks.findIndex(x=>x.id===task.id);
      if(i>-1){ const j=(s.tasks[i].subtasks||[]).findIndex(y=>y.id===st.id);
        if(j>-1){ s.tasks[i].subtasks[j].done=cb.checked; autoMarkParent(s.tasks[i]); save(s); render(s,activeDate);} }
    });
    const txt=document.createElement('div'); txt.className='editable'; txt.textContent=st.text;
    txt.addEventListener('click',()=>{
      enableInlineEdit(txt,()=>st.text,(val)=>{
        const s=load(); const i=s.tasks.findIndex(x=>x.id===task.id);
        if(i>-1){ const j=s.tasks[i].subtasks.findIndex(y=>y.id===st.id);
          if(j>-1){ s.tasks[i].subtasks[j].text=val; save(s); }
        }
      });
    });
    const del=document.createElement('button'); del.textContent='Del'; del.className='btn-link';
    del.addEventListener('click',()=>{
      const s=load(); const i=s.tasks.findIndex(x=>x.id===task.id);
      if(i>-1){ s.tasks[i].subtasks=(s.tasks[i].subtasks||[]).filter(y=>y.id!==st.id); autoMarkParent(s.tasks[i]); save(s); render(s,activeDate); }
    });
    row.appendChild(cb); row.appendChild(txt); row.appendChild(del);
    return row;
  }

  function renderTask(activeDate,task){
    const row=document.createElement('div'); row.className='task'+(task.done?' done':'');
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=task.done;
    cb.addEventListener('change',()=>{
      const s=load(); const i=s.tasks.findIndex(x=>x.id===task.id);
      if(i>-1){ s.tasks[i].done=cb.checked; save(s); render(s,activeDate); }
    });

    const txt=document.createElement('div'); txt.className='txt editable'; txt.textContent=task.text;
    txt.addEventListener('click',()=>{
      enableInlineEdit(txt,()=>task.text,(val)=>{
        const s=load(); const i=s.tasks.findIndex(x=>x.id===task.id);
        if(i>-1){ s.tasks[i].text=val; save(s); }
      });
    });

    const del=document.createElement('button'); del.textContent='Del'; del.className='btn-link';
    del.addEventListener('click',()=>{
      const s=load(); s.tasks=s.tasks.filter(x=>x.id!==task.id); save(s); render(s,activeDate);
    });

    const stWrap=document.createElement('div'); stWrap.className='subtasks';
    (task.subtasks||[]).forEach(st=> stWrap.appendChild(renderSubtask(activeDate,task,st)) );

    const stComposer=document.createElement('div');
    stComposer.className='composer';
    stComposer.setAttribute('contenteditable','true');
    stComposer.setAttribute('role','textbox');
    stComposer.setAttribute('tabindex','0');
    stComposer.addEventListener('keydown',(e)=>{
      if(e.key==='Enter' && !e.shiftKey){
        e.preventDefault();
        const text=stComposer.textContent.trim();
        if(text){
          const s=load(); const i=s.tasks.findIndex(x=>x.id===task.id);
          if(i>-1){ s.tasks[i].subtasks=s.tasks[i].subtasks||[]; s.tasks[i].subtasks.push({id:'s_'+(Date.now()+Math.random()).toString(36), text, done:false}); save(s); stComposer.textContent=''; render(s,activeDate); }
        }
      }
    });
    stComposer.addEventListener('blur',()=>{
      const text=stComposer.textContent.trim();
      if(text){
        const s=load(); const i=s.tasks.findIndex(x=>x.id===task.id);
        if(i>-1){ s.tasks[i].subtasks=s.tasks[i].subtasks||[]; s.tasks[i].subtasks.push({id:'s_'+(Date.now()+Math.random()).toString(36), text, done:false}); save(s); stComposer.textContent=''; render(s,activeDate); }
      }
    });

    const content=document.createElement('div');
    content.appendChild(txt);
    content.appendChild(stWrap);
    content.appendChild(stComposer);

    row.appendChild(cb);
    row.appendChild(content);
    row.appendChild(del);
    return row;
  }

  // ===== render categories & list =====
  function render(state,activeDate){
    const root=els.listRoot; if(!root) return; root.innerHTML='';
    const cats=categoriesForDate(state,activeDate);

    cats.forEach(cat=>{
      const section=document.createElement('div'); section.className='category';
      const h=document.createElement('h3');
      const nameSpan=document.createElement('span'); nameSpan.textContent=cat;
      if(!PERMANENT.includes(cat)){
        nameSpan.className='editable';
        nameSpan.addEventListener('click',()=>{
          enableInlineEdit(nameSpan,()=>cat,(val)=>renameAdHocCategory(activeDate,cat,val));
        });
      }

      const links=document.createElement('span'); links.className='cat-links';
      if(cat==="Law School"){ appendLink(links,'https://brightspace.cuny.edu/d2l/home','Brightspace',true); }
      if(cat==="Law360"){ appendLink(links,'https://www.law360.com/newsroom/articles','Newsroom',true); appendLink(links,'https://docs.google.com/document/d/1jn7sFtJRrP3bkZB1pqduhSteLj6zdp5TWwUkQ9yTiR8/edit?pli=1&tab=t.0','A2J Budget'); }

      if(!PERMANENT.includes(cat)){
        const delBtn=document.createElement('button'); delBtn.textContent='Delete'; delBtn.className='btn-link';
        delBtn.addEventListener('click',(e)=>{
          e.preventDefault();
          const current=(nameSpan.textContent||'').trim();
          const msg=current?`Delete category "${current}" and all its tasks for ${activeDate}?`:`Delete this category and all its tasks for ${activeDate}?`;
          if(confirm(msg)) deleteAdHocCategory(activeDate,current);
        });
        h.appendChild(delBtn);
      }

      h.prepend(nameSpan);
      if(links.childNodes.length) h.appendChild(links);
      section.appendChild(h);

      tasksForDate(state,activeDate)
        .filter(t=> (t.category||'')===cat )
        .forEach(task=> section.appendChild(renderTask(activeDate,task)) );

      // inline composer for new task under this category
      const composer=document.createElement('div');
      composer.className='composer';
      composer.setAttribute('contenteditable','true');
      composer.setAttribute('role','textbox');
      composer.setAttribute('tabindex','0');
      composer.addEventListener('keydown',(e)=>{
        if(e.key==='Enter' && !e.shiftKey){
          e.preventDefault();
          const text=composer.textContent.trim();
          if(text){
            const s=load();
            s.tasks.push({id:'t_'+(Date.now()+Math.random()).toString(36), text, category:cat, done:false, dueDate:activeDate, subtasks:[]});
            save(s);
            composer.textContent='';
            render(s,activeDate);
          }
        }
      });
      composer.addEventListener('blur',()=>{
        const text=composer.textContent.trim();
        if(text){
          const s=load();
          s.tasks.push({id:'t_'+(Date.now()+Math.random()).toString(36), text, category:cat, done:false, dueDate:activeDate, subtasks:[]});
          save(s);
          composer.textContent='';
          render(s,activeDate);
        }
      });
      section.appendChild(composer);

      els.listRoot.appendChild(section);
    });
  }

  // ===== controls =====
  function clearDayTasks(date){ const d=date||els.activeDay.value||todayStr(); const s=load(); s.tasks=s.tasks.filter(t=>t.dueDate!==d); save(s); render(s,d); }
  function rolloverNow(date){ const d=date||els.activeDay.value||todayStr(); const next=nextDateStr(d); const s=load(); s.tasks.forEach(t=>{ if(t.dueDate===d && !t.done){ t.dueDate=next; } }); const adhoc=s.adHocByDate[next]=s.adHocByDate[next]||[]; s.tasks.filter(t=>t.dueDate===next && !PERMANENT.includes(t.category)).forEach(t=>{ const nm=(t.category||'').trim(); if(nm && !adhoc.map(x=>x.toLowerCase()).includes(nm.toLowerCase())) adhoc.push(nm); }); save(s); render(s,d); }

  // ===== wire UI =====
  els.activeDay.addEventListener('change',()=>{ const s=load(); render(s,els.activeDay.value||todayStr()); });
  els.btnClearDay.addEventListener('click',()=>{ const d=els.activeDay.value||todayStr(); if(confirm(`Clear ALL tasks for ${d}?`)) clearDayTasks(d); });
  els.btnRollover.addEventListener('click',()=>{ const d=els.activeDay.value||todayStr(); rolloverNow(d); alert(`Rescheduled unchecked tasks that were due on ${d} to the next day. (Overdue tasks keep their original dates.)`); });

  els.newCategoryComposer.addEventListener('keydown',(e)=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); addCategory(); }
  });
  els.newCategoryComposer.addEventListener('blur',()=>{
    if((els.newCategoryComposer.textContent||'').trim()) addCategory();
  });
  function addCategory(){
    const name=(els.newCategoryComposer.textContent||'').trim();
    const date=els.newCategoryDate.value||els.activeDay.value||todayStr();
    if(!name) return;
    const s=load(); s.adHocByDate[date]=s.adHocByDate[date]||[];
    if(!s.adHocByDate[date].map(x=>x.toLowerCase()).includes(name.toLowerCase())) s.adHocByDate[date].push(name);
    save(s); els.newCategoryComposer.textContent=''; render(s,date);
  }

  // ===== init =====
  const t=todayStr();
  els.activeDay.value=t;
  els.newCategoryDate.value=t;
  const s0=load();
  render(s0,t);
  // Start optional remote sync (if firebaseConfig is filled)
  initRemoteSync(t);

  // ===== tests (open with ?test=1) =====
  if(TEST){
    try{
      console.log('%c[TEST] start','color:#0ff');
      // Ensure render populates categories
      const cats = categoriesForDate(load(), t);
      console.assert(Array.isArray(cats) && cats.includes('Law School') && cats.includes('Law360'), 'Permanent categories present');

      // Separator logic for links
      const tmp=document.createElement('span');
      appendLink(tmp,'#','One',true); // should add sep before first
      appendLink(tmp,'#','Two');
      const seps=tmp.querySelectorAll('.sep').length;
      console.assert(seps===2,'Two separators for two links (lead + middle)');

      // Add category & delete it
      const s=load(); s.adHocByDate[t]=['Errands']; s.tasks.push({id:'tX',text:'Buy',category:'Errands',done:false,dueDate:t,subtasks:[]}); save(s);
      deleteAdHocCategory(t,'Errands');
      const s1=load();
      console.assert(!(s1.adHocByDate[t]||[]).includes('Errands'),'Ad-hoc category removed');
      console.assert(!s1.tasks.some(x=>x.category==='Errands'&&x.dueDate===t),'Tasks under removed category purged');

      // Rollover check
      const s2=load(); s2.tasks.push({id:'tR',text:'Roll me',category:'Personal',done:false,dueDate:t,subtasks:[]}); save(s2);
      const next=nextDateStr(t); rolloverNow(t);
      const s3=load(); console.assert(s3.tasks.some(x=>x.id==='tR'&&x.dueDate===next),'Rollover moved incomplete task to next day');

      console.log('%c[TEST] ok','color:#0ff');
    }catch(err){ console.error('[TEST] failed', err); }
  }
})();
</script>
